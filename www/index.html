<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e4e7ec">
<meta name="description" content="AI film script breakdown: single line orders, artist and location lists, breakdown sheets, costume continuity, art and props, character profiles.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ScriptDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ScriptDesk look: soft "neumorphic" surfaces (raised, pressed, inset) with a deep teal accent.
   Light is the default; dark keeps the same shapes. Sheets stay white like printed paper.
   Clapperboard logo + clap on save. Icons are CSS masks (.ic + .i-name). */
:root{
  color-scheme:light;
  --bg:#e4e7ec; --bg-2:#e4e7ec; --panel:#e4e7ec; --panel-2:#dce0e7; --raise:#d3d8e0;
  --line:#cbd1da; --line-2:#d6dae2;
  --fg:#232830; --muted:#586070; --faint:#858c99;
  --accent:#0e6670; --accent-hi:#14808b; --accent-ink:#ffffff; --accent-soft:rgba(14,102,112,.12); --accent-line:rgba(14,102,112,.32);
  --day:#a86a00; --night:#2c5bd0; --ok:#17803f; --warn:#96600a; --bad:#c62d4a;
  --sh-hi:#fbfcfe; --sh-lo:#b3bac6;
  --sh-raise:7px 7px 16px var(--sh-lo),-7px -7px 16px var(--sh-hi);
  --sh-raise-sm:4px 4px 9px var(--sh-lo),-4px -4px 9px var(--sh-hi);
  --sh-raise-lg:12px 12px 28px var(--sh-lo),-12px -12px 28px var(--sh-hi);
  --sh-inset:inset 4px 4px 9px var(--sh-lo),inset -4px -4px 9px var(--sh-hi);
  --sh-inset-sm:inset 2px 2px 5px var(--sh-lo),inset -2px -2px 5px var(--sh-hi);
  --glass:linear-gradient(180deg,#1b8f9b 0%,#0e6670 100%);
  --top-bg:rgba(228,231,236,.96); --veil:rgba(190,196,208,.55);
  --pill-bg:#dcf2e5; --pill-line:#43a56a; --pill-fg:#0e3a22; --pill-sub:#2e6a47;
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-script:"Courier Prime","Courier New",Courier,monospace;
  --r:12px; --r-lg:20px; --r-xl:28px; --side:256px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1c1f26; --bg-2:#1c1f26; --panel:#1c1f26; --panel-2:#21252d; --raise:#292e38;
  --line:#2c313b; --line-2:#242831;
  --fg:#eef1f5; --muted:#a1a8b4; --faint:#6c7482;
  --accent:#4cc2bb; --accent-hi:#7ad9d2; --accent-ink:#05292b; --accent-soft:rgba(76,194,187,.14); --accent-line:rgba(76,194,187,.36);
  --day:#fcd34d; --night:#8fb4ff; --ok:#4ade80; --warn:#fbbf24; --bad:#fb7185;
  --sh-hi:#272c36; --sh-lo:#101216;
  --glass:linear-gradient(180deg,#68d6cf 0%,#35aaa4 100%);
  --top-bg:rgba(28,31,38,.96); --veil:rgba(8,9,12,.58);
  --pill-bg:#10382a; --pill-line:#2f9d5b; --pill-fg:#d9f7e5; --pill-sub:#9fd8b5;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;--appbar-h:68px}
.appbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--appbar-h);padding:0 22px 0 14px;background:var(--top-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* Icons: mask-based so they follow text colour */
.ic,.btn[data-ic]::before{width:18px;height:18px;flex:none;background:currentColor;
  -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.ic{display:inline-block}
.btn[data-ic]::before{content:"";width:16px;height:16px}

/* Sidebar: one raised slab */
.side{margin:0 0 14px 14px;background:var(--bg);border-radius:var(--r-xl);box-shadow:var(--sh-raise);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:42px;height:42px;padding:8px;flex:none;color:var(--fg);border-radius:15px;box-shadow:var(--sh-inset-sm)}
.brand .logo .stick{transform-origin:5px 12px;animation:clap .9s .35s var(--ease) 1 both}
.brand.clap .logo .stick{animation:clap .6s var(--ease) 1 both}
.brand b{font:800 23px/1 var(--f-display);letter-spacing:-.035em}
.brand b span{color:var(--accent);font-weight:700}
.nav{overflow:auto;padding:4px 12px 14px;flex:1;min-height:0}
.nav h6{margin:18px 0 6px 12px;font:600 12px/1 var(--f-ui);color:var(--faint)}
.nav button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:14px;color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:500;gap:12px;align-items:center;position:relative;transition:box-shadow .18s,color .15s,background .15s}
.nav button .ic{transition:color .15s}
.nav button:hover{color:var(--fg);box-shadow:var(--sh-raise-sm)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700;box-shadow:var(--sh-inset)}
.side-foot{padding:12px 18px 16px;font-size:12px;color:var(--faint)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding-block:6px 8px;padding-inline:24px;flex-wrap:wrap;background:var(--top-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.film{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.film input{background:transparent;border:0;border-radius:10px;padding:2px 8px;min-width:0;width:100%;max-width:420px;transition:box-shadow .15s}
.film input:hover{box-shadow:var(--sh-inset-sm)}
.film input:focus{box-shadow:var(--sh-inset);outline:none}
#fTitle{font:800 20px/1.2 var(--f-display);letter-spacing:-.02em}
#fProd{font-size:12px;color:var(--muted)}
.tops{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn);animation:blink 1s ease-in-out infinite} .sync.err i{background:var(--bad)}

/* Buttons: raised pills; pressed = inset. Primary = glass teal */
.btn{border:1px solid transparent;background:var(--bg);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--fg);
  box-shadow:var(--sh-raise-sm);transition:box-shadow .15s,transform .12s var(--ease),filter .15s,color .15s}
.btn:hover{box-shadow:var(--sh-raise);color:var(--accent)}
.btn:active:not(:disabled){box-shadow:var(--sh-inset-sm);transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.pri{background:var(--glass);border:1px solid rgba(255,255,255,.28);color:var(--accent-ink);font-weight:700;
  box-shadow:var(--sh-raise-sm),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 6px rgba(0,0,0,.14)}
.btn.pri:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.pri:active:not(:disabled){box-shadow:inset 0 2px 8px rgba(0,0,0,.28)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.shotcard{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-raise-sm);padding:12px 14px;margin-bottom:14px}
.sc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}.sc-h .no{font-size:15px;color:var(--accent);min-width:2.5em}.sc-h .grow{flex:1;min-width:160px}.sc-h .loc{font-weight:600}
.sc-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.nowrap{white-space:nowrap}
.sset{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-inset-sm);padding:10px 14px;margin-bottom:16px}
.sset summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.sset-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;margin-top:10px}
.sset-g label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.sset-g input,.sset-g select{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--fg);font:inherit;font-size:13px}
.brief{display:block;min-height:3.2em;padding:8px 10px!important;margin:0!important;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;background:var(--bg-2)}
[contenteditable][data-ph]:empty::before{content:attr(data-ph);color:var(--faint)}
.sday{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-raise-sm);padding:12px 14px;margin-bottom:14px;transition:box-shadow .15s}
.sday.t-off,.sday.t-travel{background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(127,127,127,.07) 10px 20px),var(--bg)}
.sday.bin{box-shadow:var(--sh-inset-sm)}.sday.drop-over{box-shadow:0 0 0 2px var(--accent),var(--sh-raise-sm)}
.sday-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.sday-h b{font-size:14px}.sday-h .grow{flex:1}
.sday-h input.mini,.sday-h select.mini,.ph select.mini{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:4px 7px;color:var(--fg);font-size:12.5px}
.sday-note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.grip{color:var(--faint);margin-right:6px;cursor:grab;letter-spacing:-2px}tr.dragging{opacity:.4}.drop-hint{margin:6px 0 2px}
.dood-w{overflow:auto}.t.dood th,.t.dood td{padding:4px 5px}
.t.dood .stk{position:sticky;left:0;background:#fff;z-index:1;text-align:left;white-space:nowrap}
.t.dood th.dh{font-size:11px;white-space:nowrap}.t.dood th.dh small{display:block;font-weight:400;color:#666}
.t.dood th.off,.t.dood th.travel,.t.dood td.off{background:#f1f1f1}
.dd{border:0;background:transparent;font:700 11px/1 var(--f-ui);min-width:32px;padding:6px 3px;border-radius:6px;cursor:pointer;color:#333}
.dd.c-x{color:#bbb;font-weight:400}.dd.c-W{background:#d9efe0;color:#1e6b38}.dd.c-SW,.dd.c-WF,.dd.c-SWF{background:#b7dfc5;color:#14532d}.dd.c-H{background:#fdf0c4;color:#8a5500}.dd.c-T{background:#dbe7fb;color:#1d4ed8}
.dd.over{box-shadow:inset 0 0 0 1.5px #2f6fd6}
.cs{display:flex;flex-direction:column;gap:14px}
.cs-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-raise-sm);padding:14px 18px}
.cs-prod{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.cs-film{font-size:20px;font-weight:800}.cs-day{font-weight:700;color:var(--accent);margin-top:2px}
.cs-sun{display:flex;gap:18px;align-items:center}.cs-sun div{display:flex;flex-direction:column;align-items:center}.cs-sun span{font-size:11px;color:var(--muted)}.cs-sun b{font-size:18px}
.cs-sec{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-raise-sm);padding:12px 16px}
.cs-sec h3{margin:0 0 10px;font:700 14px/1.3 var(--f-ui)}
.cs-kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 14px;font-size:13px;margin-bottom:8px}.cs-k{color:var(--muted)}
.cs-dept{grid-template-columns:repeat(2,minmax(110px,170px) 1fr)}
.cs-multi{display:block;white-space:pre-wrap;min-height:2.4em;padding:6px 8px!important;margin:4px 0 0!important;border:1px dashed var(--line);border-radius:8px;font-size:13px}
@media (max-width:640px){.cs-kv,.cs-dept{grid-template-columns:1fr}.cs-k{margin-top:6px;font-weight:600}}
.seg.gneed{flex-wrap:wrap;margin-bottom:6px;max-width:100%}.seg.gneed button{white-space:nowrap}
.gtarget{max-width:320px;margin:0 0 10px}.gneeds{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.nfl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.gk{margin:18px 0 10px;font:700 15px/1.3 var(--f-ui)}
/* Camera & equipment: scene view (editorial) */
.gst{--gw:#f6f3ee;--gi:#1d1d1f;--gm:#6e6a64;--gl:rgba(0,0,0,.12);--gt:#ece8e1;--gc:#fff;margin:-18px -26px -56px;background:var(--gw);color:var(--gi);font-family:var(--f-ui);overflow:hidden;line-height:1.4}
:root[data-theme="dark"] .gst{--gw:#141311;--gi:#f2efe9;--gm:#a49f96;--gl:rgba(255,255,255,.14);--gt:#1c1a17;--gc:#23211d}
.gst-top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,40px);position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--gw) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--gl)}
.gst-top .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}.gst-top .seg{flex-wrap:nowrap}.gst-top .seg button{white-space:nowrap;flex:none}.gst-top .seg::-webkit-scrollbar{display:none}
.gst-pick{display:flex;align-items:center;gap:6px}.gst-pick select{max-width:min(46vw,300px);border:1px solid var(--gl);background:var(--gc);color:var(--gi);border-radius:999px;padding:7px 12px;font:600 13px var(--f-ui)}
.gst-ar{width:32px;height:32px;border-radius:50%;border:1px solid var(--gl);background:var(--gc);color:var(--gi);font-size:18px;line-height:1;cursor:pointer}.gst-ar:disabled{opacity:.35;cursor:default}
.gst-hero{text-align:center;padding:clamp(48px,8vw,110px) clamp(20px,6vw,80px) clamp(32px,5vw,60px)}
.gst-eye{margin:0;font:600 12px/1.4 var(--f-ui);letter-spacing:.14em;color:var(--gm)}
.gst-big{font:700 clamp(40px,8vw,96px)/1.02 var(--f-display);letter-spacing:-.04em;margin:.22em auto .1em;max-width:14em;text-wrap:balance}.gst-big.sm{font-size:clamp(30px,5.4vw,60px);margin-top:.3em}
.gst-h{font:700 clamp(30px,5vw,56px)/1.06 var(--f-display);letter-spacing:-.035em;margin:.2em auto .15em;text-wrap:balance}
.gst-lead,.gst-p{font-size:clamp(16px,2vw,22px);color:var(--gm);max-width:32em;margin:.5em auto 0}.gst-p{font-size:clamp(15px,1.7vw,19px)}
.gst-fine{font-size:12.5px;color:var(--gm);margin:18px 0 0}
.gst-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.gst-b{border:1px solid var(--gl);background:transparent;color:var(--gi);border-radius:999px;padding:13px 26px;font:600 15px var(--f-ui);cursor:pointer;transition:transform .25s,background .25s,box-shadow .25s}.gst-b:hover{transform:translateY(-1px);background:var(--gc)}
.gst-b.dark{background:#111;color:#fff;border-color:#111}.gst-b.dark:hover{background:#2a2a2c}:root[data-theme="dark"] .gst-b.dark{background:#f2efe9;color:#141311;border-color:#f2efe9}:root[data-theme="dark"] .gst-b.dark:hover{background:#fff}
.gst-l{border:0;background:none;color:var(--accent);font:600 14px var(--f-ui);cursor:pointer;padding:4px 2px;white-space:nowrap}.gst-l:hover{text-decoration:underline}
.gst-full{margin:0;position:relative;height:clamp(300px,58vw,720px);overflow:hidden;background:#05070b}.gst-art{width:100%;height:100%;display:block;animation:gstZoom 2.2s cubic-bezier(.2,.7,.2,1) both}
.gst-full figcaption{position:absolute;left:18px;bottom:14px;font-size:11.5px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);padding:5px 11px;border-radius:999px}
.gst-s{padding:clamp(56px,9vw,120px) clamp(20px,6vw,80px);text-align:center}.gst-s.tint{background:var(--gt)}.gst-s.dark{background:#111113;color:#f5f2ec}.gst-s.dark .gst-p{color:#a9a49c}.gst-s.end{padding-bottom:clamp(72px,11vw,140px)}
.gst-script{max-width:640px;margin:30px auto 0;text-align:left;background:var(--gc);border-radius:20px;padding:clamp(18px,3vw,30px);box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -22px rgba(0,0,0,.25);font-family:var(--f-script)}
.gst-script b{display:block;font-size:14px;letter-spacing:.02em}.gst-script p{margin:.9em 0 0;font-size:15px;line-height:1.7}.gst-meta{margin-top:18px;font-size:13px;color:var(--gm)}
.gst-art-wrap svg{width:min(480px,82%);height:auto;margin:22px auto 0;display:block;background:#fff;border-radius:28px;padding:16px;box-sizing:content-box;transition:transform .5s cubic-bezier(.2,.7,.2,1)}.gst-art-wrap:hover svg{transform:scale(1.02)}
.gst-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:1120px;margin:38px auto 0}
.gst-tile{background:var(--gt);border-radius:26px;padding:14px 14px 22px;text-align:left;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}.gst-tile:hover{transform:translateY(-4px);box-shadow:0 22px 40px -26px rgba(0,0,0,.4)}
.gst-prod{width:100%;height:auto;display:block;background:#fff;border-radius:18px;padding:8px;box-sizing:border-box}
.gst-tile h3{font:700 clamp(18px,2vw,24px)/1.15 var(--f-display);letter-spacing:-.02em;margin:16px 6px 6px}.gst-tile p{margin:0 6px;color:var(--gm);font-size:14px}.gst-tile small{display:block;margin:12px 6px 0;font-size:12.5px;color:var(--gi);opacity:.78}
.gst-alts{list-style:none;margin:34px auto 0;padding:0;max-width:760px}.gst-alts li{display:flex;gap:18px;align-items:center;justify-content:space-between;padding:22px 0;border-top:1px solid var(--gl);text-align:left}.gst-alts li:last-child{border-bottom:1px solid var(--gl)}
.gst-alts h3{font:700 clamp(18px,2.2vw,26px)/1.15 var(--f-display);letter-spacing:-.02em;margin:0 0 4px}.gst-alts p{margin:0;color:var(--gm);font-size:14.5px}
.gst-checks{list-style:none;margin:36px auto 0;padding:0;max-width:760px;display:grid;gap:4px;text-align:left}.gst-checks li{display:flex;gap:16px;padding:20px 0;border-top:1px solid rgba(255,255,255,.14)}.gst-checks h3{margin:0 0 4px;font:650 18px var(--f-display)}.gst-checks p{margin:0;color:#b9b4ab;font-size:14.5px}
.gst-ck{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-ui)}.gst-ck.ok{background:#2f9e6a;color:#fff}.gst-ck.no{background:#d98a1f;color:#fff}.gst-ck.q{background:#3a3a3e;color:#ddd}
.gst-rel{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:26px;font-size:13px;color:#a9a49c}.gst-rel select{background:#1d1d20;color:#f5f2ec;border:1px solid #3a3a3e;border-radius:999px;padding:7px 12px;font:600 13px var(--f-ui)}
.gst-src{list-style:none;margin:26px auto 0;padding:0;max-width:720px;display:grid;gap:10px}.gst-src a{color:var(--gi);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gl);font-size:15px;transition:text-decoration-color .25s}.gst-src a:hover{text-decoration-color:var(--accent)}
@keyframes gstUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@keyframes gstZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.gst-hero>*{animation:gstUp .9s cubic-bezier(.2,.7,.2,1) both}.gst-hero>*:nth-child(2){animation-delay:.08s}.gst-hero>*:nth-child(3){animation-delay:.16s}.gst-hero>*:nth-child(4){animation-delay:.24s}
@supports (animation-timeline:view()){.gst-s>*{animation:gstUp linear both;animation-timeline:view();animation-range:entry 0% entry 45%}}
@media (max-width:820px){.gst{margin-inline:-16px;margin-bottom:-120px}.gst-tiles{grid-template-columns:1fr 1fr;gap:10px}.gst-alts li{flex-wrap:wrap}.gst-pick select{max-width:44vw}.gst-top{top:calc(var(--appbar-h,0px) + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){.gst *{animation:none!important;transition:none!important}}

.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gcard{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-raise-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gcard p{margin:0;line-height:1.5}.gc-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.gc-h b{font-size:14px}
.gc-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto;padding-top:6px}.gc-f .grow{flex:1}.gc-f a{color:var(--accent)}
.pool-box{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-inset-sm);padding:14px 16px;margin:6px 0 14px}
.pool-box h3{margin:0 0 6px;font:700 14px/1.3 var(--f-ui)}
.pool-row{display:flex;gap:8px;align-items:center;padding:8px 10px;margin-bottom:8px;border-radius:14px;box-shadow:var(--sh-raise-sm);background:var(--bg)}
.pool-row.off{opacity:.55}.pool-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.pool-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.mgrp{margin:10px 0;padding:10px 12px;border-radius:14px;box-shadow:var(--sh-inset-sm);background:var(--bg)}
.mgrp h4{margin:0 0 8px;font:700 12.5px/1.3 var(--f-ui);display:flex;gap:8px;align-items:center}.mgrp h4 span{font-weight:600;color:var(--muted)}
.mgrp.free h4{color:var(--accent)}.mgrp.paid h4{color:var(--muted)}
.mgrp>div{display:flex;flex-wrap:wrap;gap:6px}
.mchip{border:0;font:12px/1.2 var(--f-ui);padding:6px 10px;border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer;box-shadow:var(--sh-raise-sm)}
.mchip.free::before{content:"FREE";font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--accent);margin-right:6px}
.mchip.busy{opacity:.85}.mchip.paid{cursor:default;box-shadow:none;opacity:.55;text-decoration:line-through}
.mchip.na{cursor:default;box-shadow:none;opacity:.5}
.mchip.paid::before{content:"PAID";font-size:9.5px;font-weight:800;margin-right:6px;text-decoration:none;display:inline-block}
.pool-opt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pool-opt select{width:auto!important;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--fg)}
@media (max-width:560px){.pool-row{flex-wrap:wrap}.pool-main{flex-basis:100%}}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{box-shadow:var(--sh-raise-sm);color:var(--fg)}
.btn.warn{color:var(--warn)}
.btn.danger{color:var(--bad)}
.btn.icon{padding:9px;aspect-ratio:1}
.btn.rec::before{background:var(--bad);-webkit-mask:none;mask:none;border-radius:50%;width:9px;height:9px;animation:rec 1.2s ease-in-out infinite}
.job{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
.prog{width:130px;height:8px;background:var(--bg);border-radius:6px;overflow:hidden;box-shadow:var(--sh-inset-sm)}
.prog i{display:block;height:100%;width:0;border-radius:6px;transition:width .35s var(--ease);
  background:repeating-linear-gradient(115deg,var(--accent) 0 8px,var(--accent-hi) 8px 16px);background-size:22px 100%;animation:march .9s linear infinite}
.content{flex:1;overflow:auto;min-height:0;padding-block:18px 56px;padding-inline:26px}
.content.swap{animation:swap .18s var(--ease)}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font:800 30px/1.1 var(--f-display);letter-spacing:-.03em;text-wrap:balance}
.ph p{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.ph .grow{flex:1;min-width:220px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:4px;gap:2px;border-radius:999px;background:var(--bg);box-shadow:var(--sh-inset)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);transition:box-shadow .15s,color .15s}
.seg button[aria-pressed="true"]{box-shadow:var(--sh-raise-sm);color:var(--accent);font-weight:700}
.search{background:var(--bg);border:0;border-radius:999px;padding:9px 16px;width:200px;font-size:13px;box-shadow:var(--sh-inset);transition:box-shadow .15s}
.search:focus{outline:2px solid var(--accent-line);outline-offset:2px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:18px;font-size:13px;box-shadow:var(--sh-raise-sm)}
.banner.info{box-shadow:var(--sh-inset-sm)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:16px}
.stat b{display:block;font:800 27px/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Tables: Excel-style sheets (white grid, black borders, coloured header cells) */
.tw{overflow-x:auto;background:#fff;border:1px solid #1a1a1a;color:#111;color-scheme:light;-webkit-overflow-scrolling:touch;border-radius:18px;box-shadow:var(--sh-raise)}
table.t{border-collapse:collapse;width:100%;min-width:760px;font:13px/1.35 Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#111}
.t th{font:700 12.5px/1.25 Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#111;text-align:center;padding:8px;border:1px solid #1a1a1a;background:#d9d9d9;white-space:nowrap;position:sticky;top:0;z-index:1}
.t th.c-eff{background:#9dc3e6} .t th.c-loc{background:#ffe699} .t th.c-desc{background:#ddebf7}
.t td{padding:6px 8px;border:1px solid #1a1a1a;vertical-align:middle;text-align:center;background:#fff}
.t td.no{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.t td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.t td.eff{white-space:nowrap;font-weight:700}
.t td.eff.d{background:#fbf2d0} .t td.eff.n{background:#e3e7f7}
.t td.loc{font-weight:600}
.t td.left{text-align:left}
.t tr.g td{background:#d9d9d9;font:700 13px/1.3 Calibri,Carlito,"Segoe UI",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;color:#111;padding:7px 8px}
.t tr.g td small{font-weight:400;color:#444;text-transform:none;margin-left:8px}
.t tr.g.band td{background:#bfbfbf}
.t .eff-n,.t .eff-d{color:#111}
.t .muted{color:#555} .t .faint{color:#777}
.t .crowd{color:#444}
.t .tag{border-color:#9a9a9a;color:#333} .t .tag.warn{border-color:#d08a00;color:#8a5500} .t .tag.bad{border-color:#c0392b;color:#a12a1e} .t .tag.acc{border-color:#c79422;color:#7a5200} .t .tag.ok{color:#1e6b38;border-color:#3c9a5f}
.t [contenteditable]:hover{background:#eef3fb} .t [contenteditable]:focus{background:#fffbe6;box-shadow:0 0 0 1.5px #c48a12}
.t [contenteditable]:empty::before{color:#9a9a9a}
.t select.mini{background:#fff;border-color:#9a9a9a;color:#111}
.t .btn.ghost{color:#444} .t .btn.danger{color:#b3261e}
.eff-n{color:var(--night)} .eff-d{color:var(--day)}
.crowd{color:var(--muted);font-size:12.5px;margin-top:2px}
[contenteditable]{border-radius:3px;outline:none;min-width:2ch;cursor:text;padding:1px 2px;margin:-1px -2px;transition:background .12s}
.t tr.g [contenteditable]{display:inline-block;min-width:10ch}
[contenteditable]:hover{background:var(--raise)}
[contenteditable]:focus{background:var(--raise);box-shadow:0 0 0 1.5px var(--accent)}
[contenteditable]:empty::before{content:"—";color:var(--faint)}
.crowd[contenteditable]:empty::before{content:"+ crowd"}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{border-color:rgba(251,191,36,.45);color:var(--warn)}
.tag.bad{border-color:rgba(251,113,133,.45);color:var(--bad)}
.tag.ok{border-color:rgba(74,222,128,.4);color:var(--ok)}
.tag.acc{border-color:var(--accent-line);color:var(--accent-hi)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12px}
select.mini{background:var(--bg);border:0;box-shadow:var(--sh-inset-sm);border-radius:8px;padding:3px 5px;font-size:12px;max-width:150px}

/* Cards as Excel-style sheets (breakdown sheet per scene, profiles) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:18px}
.card{overflow:hidden;background:#fff;color:#111;border:1px solid #1a1a1a;min-width:0;color-scheme:light;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;border-radius:18px;box-shadow:var(--sh-raise);transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{box-shadow:var(--sh-raise-lg)}
.card-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;padding:10px 12px;border-bottom:1px solid #1a1a1a;background:#fff}
.card-h .no{font:700 28px/1 Calibri,Carlito,Arial,sans-serif;grid-row:span 3;min-width:2.2ch;padding-right:10px;border-right:1px solid #1a1a1a;font-variant-numeric:tabular-nums}
.card-h .hl{font-weight:700;font-size:13px;text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-h .hl .effc{padding:1px 6px;border:1px solid #1a1a1a}
.card-h .hl .effc.d{background:#fbf2d0} .card-h .hl .effc.n{background:#e3e7f7}
.card-h .ttl{font-weight:700;font-size:14px;text-transform:uppercase}
.card-h .ttl>div{display:inline-block;background:#ffff00;padding:0 4px}
.card-h .ttl>div:empty{background:transparent}
.card-h .ds{font-size:13px;color:#222}
.kv{display:grid;grid-template-columns:132px minmax(0,1fr);font-size:13px}
.kv>div{padding:6px 10px;border-bottom:1px solid #1a1a1a;min-width:0;overflow-wrap:anywhere}
.kv>div:nth-child(odd){background:#f2f2f2;font-weight:600;font-size:12.5px;border-right:1px solid #1a1a1a}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.card-f{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #1a1a1a;flex-wrap:wrap;align-items:center;background:#f7f7f7}
.card .tag{border-color:#9a9a9a;color:#333}.card .tag.warn{border-color:#d08a00;color:#8a5500}.card .tag.bad{border-color:#c0392b;color:#a12a1e}.card .tag.acc{border-color:#c79422;color:#7a5200}
.card .muted{color:#555}
.card [contenteditable]:hover{background:#eef3fb}.card [contenteditable]:focus{background:#fffbe6;box-shadow:0 0 0 1.5px #c48a12}.card [contenteditable]:empty::before{color:#9a9a9a}
.card .btn{background:#fff;border-color:#9a9a9a;color:#111}
.card .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prof textarea,.fieldbox textarea,.fieldbox input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical;line-height:1.5}
.card .fieldbox textarea,.card .fieldbox input{background:#fff;border:1px solid #1a1a1a;border-radius:0;color:#111;font-family:inherit}
.fieldbox{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fieldbox label{font:600 12px/1 var(--f-ui);color:var(--muted)}
.card .fieldbox label{color:#333}
.prof{padding:14px;display:flex;flex-direction:column;gap:2px}
.pname{font:700 24px/1 Calibri,Carlito,Arial,sans-serif;text-transform:uppercase;background:#d9d9d9;margin:-14px -14px 10px;padding:10px 14px;border-bottom:1px solid #1a1a1a}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 14px}

/* Script */
.scr{display:flex;flex-direction:column;gap:16px;max-width:880px}
.sc{background:#fff;color:#111;border:1px solid #1a1a1a;overflow:hidden;color-scheme:light;border-radius:18px;box-shadow:var(--sh-raise)}
.sc .tag{border-color:#9a9a9a;color:#333}.sc .eff-n,.sc .eff-d{color:#111}
.sc .btn{background:#fff;border-color:#9a9a9a;color:#111}.sc .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.sc .btn.danger{color:#b3261e}.sc .faint{color:#666}
.sc-h{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #1a1a1a;background:#d9d9d9;flex-wrap:wrap}
.sc-h .no{font:700 20px/1 var(--f-display);min-width:2.5ch}
.sc-h .hd{font-weight:600;text-transform:uppercase;font-size:13px;flex:1;min-width:0}
.page{padding:18px clamp(14px,5%,48px) 22px;font:13.5px/1.35 var(--f-script);color:#111}
.page .ln{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.35em}
.page .chr{padding-left:36%}
.page .par{padding-left:28%;color:#444}
.page .dia{padding-left:16%;padding-right:12%}
.page .trn{text-align:right;color:#444}
.page textarea{width:100%;min-height:340px;background:#fffef8;border:1px solid #1a1a1a;padding:12px;font:13px/1.4 var(--f-script);color:#111;resize:vertical}
.front{color:var(--muted);font:13px/1.4 var(--f-script);white-space:pre-wrap;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}
.card .btn,.sc .btn,.t .btn{box-shadow:none;border-radius:8px;border-color:#9a9a9a}
.card .btn.pri,.sc .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Projects */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.pcard{background:var(--bg);border:0;border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;box-shadow:var(--sh-raise);transition:box-shadow .2s,transform .2s var(--ease)}
.pcard:hover{box-shadow:var(--sh-raise-lg);transform:translateY(-2px)}
.pcard b{font:800 20px/1.15 var(--f-display);letter-spacing:-.02em}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border-radius:var(--r-xl);background:var(--bg);box-shadow:var(--sh-inset)}
.empty b{display:block;color:var(--fg);font:800 22px/1.2 var(--f-display);letter-spacing:-.02em;margin-bottom:6px}

/* Modal, toast, checks */
.ov{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .18s ease-out}
.modal{background:var(--bg);border:0;border-radius:var(--r-xl);width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:var(--sh-raise-lg);animation:rise .24s var(--ease)}
.modal-h{display:flex;align-items:center;padding:18px 22px 8px}
.modal-h h2{margin:0;font:800 21px/1.1 var(--f-display);letter-spacing:-.03em;flex:1}
.modal-b{padding:10px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:10px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.drop{border:0;border-radius:var(--r-lg);padding:26px;text-align:center;color:var(--muted);cursor:pointer;display:block;box-shadow:var(--sh-inset);transition:box-shadow .15s,color .15s}
.drop:hover{color:var(--accent)}
.drop.over{box-shadow:var(--sh-inset),0 0 0 2px var(--accent)}
.modal textarea,.prof textarea,.fieldbox textarea,.fieldbox input,.modal input[type=text],.modal select{width:100%;border:0;border-radius:14px;padding:11px 14px;background:var(--bg);box-shadow:var(--sh-inset);resize:vertical;line-height:1.5}
.modal textarea{min-height:180px;font:12.5px/1.4 var(--f-script)}
.modal input:focus,.modal textarea:focus,.modal select:focus,.prof textarea:focus,.fieldbox textarea:focus,.fieldbox input:focus{outline:2px solid var(--accent-line);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(0,0,0,.28);animation:toastin .25s var(--ease)}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);background:var(--bg);box-shadow:var(--sh-raise-sm);font-size:13px}
.chk button{margin-left:auto}
.bbar{display:none}
.msheet{display:none}
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:var(--r-lg);padding:12px 14px;font-size:13px;box-shadow:var(--sh-raise);animation:rise .3s var(--ease)}
.a2hs span{flex:1}

/* Change note, save bar, saved sign */
.lastnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:var(--r-lg);padding:10px 16px;margin-bottom:18px;box-shadow:var(--sh-inset-sm)}
.lastnote b{color:var(--fg);font-weight:700}
.lastnote .when{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.lastnote .what{flex:1;min-width:200px;overflow-wrap:anywhere}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:999px;padding:8px 9px 8px 20px;box-shadow:var(--sh-raise-lg);font-size:13px;font-weight:500;max-width:calc(100% - 32px);animation:rise .22s var(--ease)}
.savebar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savedpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:46;background:var(--pill-bg);border:1px solid var(--pill-line);color:var(--pill-fg);border-radius:var(--r-lg);padding:11px 16px;font-size:13px;box-shadow:var(--sh-raise);max-width:min(560px,calc(100% - 32px));animation:pop .32s var(--ease)}
.savedpill b{color:inherit;font-weight:800}
.savedpill .ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--pill-line);color:#fff;font-size:12px;margin-right:7px;vertical-align:-3px}
.savedpill small{display:block;color:var(--pill-sub);margin-top:3px;font-size:11.5px}

/* Writer: screenplay page in Celtx / industry layout (US Letter, Courier 12 pt, 1.5" left margin) */
.wr{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.wr-side{position:sticky;top:0;max-height:calc(100vh - 190px);overflow:auto;background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh-inset-sm);padding:10px}
.wr-side h3{margin:4px 8px 8px;font:700 13px/1.2 var(--f-ui);color:var(--muted)}
.wr-side button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:10px;cursor:pointer;font:11.5px/1.35 var(--f-script);color:var(--fg)}
.wr-side button b{min-width:2.6em;color:var(--accent);font-weight:700}
.wr-side button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-side button:hover{box-shadow:var(--sh-raise-sm)}
.wr-side button[aria-current="true"]{box-shadow:var(--sh-inset-sm);color:var(--accent)}
.wr-main{min-width:0;position:relative;container-type:inline-size}
.wr-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 0 14px;background:var(--bg)}
.wr-types{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg);box-shadow:var(--sh-inset);overflow-x:auto;max-width:100%;scrollbar-width:none}
.wr-types button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:box-shadow .15s,color .15s}
.wr-types button[aria-pressed="true"]{box-shadow:var(--sh-raise-sm);color:var(--accent);font-weight:700}
.wr-stat{font-size:11.5px;line-height:1.4;color:var(--muted);margin-left:auto;text-align:right}
.wr-paper{--u:min(96px,calc(100cqw / 8.5));position:relative;width:calc(var(--u) * 8.5);margin:0 auto;background:#fff;color:#111;border-radius:4px;box-shadow:var(--sh-raise);padding:var(--u) 0 calc(var(--u) * 1.2);color-scheme:light;cursor:text}
.wr-doc{outline:none;font-family:"Courier Prime","Courier New",Courier,monospace;font-size:calc(var(--u) / 6);line-height:calc(var(--u) / 6);min-height:calc(var(--u) * 9);caret-color:#0e6670}
.wr-doc .el{position:relative;white-space:pre-wrap;overflow-wrap:break-word;margin-left:calc(var(--u) * 1.5);width:calc(var(--u) * 6);margin-top:calc(var(--u) / 6);min-height:calc(var(--u) / 6)}
.wr-doc .el:first-child{margin-top:0}
.wr-doc .el-h{margin-top:calc(var(--u) / 3);text-transform:uppercase}
.wr-doc .el-h::before{content:attr(data-n);position:absolute;left:calc(var(--u) * -0.6);color:#111}
.wr-doc .el-s,.wr-doc .el-t{text-transform:uppercase}
.wr-doc .el-t{text-align:right}
.wr-doc .el-c{margin-left:calc(var(--u) * 3.5);width:calc(var(--u) * 3.5);text-transform:uppercase}
.wr-doc .el-d{margin-left:calc(var(--u) * 2.5);width:calc(var(--u) * 3.5);margin-top:0}
.wr-doc .el-p{margin-left:calc(var(--u) * 3);width:calc(var(--u) * 2.5);margin-top:0}
.wr-doc .el.wr-empty::after{content:attr(data-ph);color:#a8a8a8;pointer-events:none}
.wr-doc[contenteditable],.wr-doc[contenteditable]:hover,.wr-doc[contenteditable]:focus{background:transparent;box-shadow:none;margin:0;padding:0;border-radius:0;min-width:0}
.wr-doc[contenteditable]:empty::before{content:none}
.wr-doc .el.pb{margin-top:calc(var(--u) * 0.9)}
.wr-marks{position:absolute;inset:0;pointer-events:none}
.wr-pg{position:absolute;left:0;right:0;border-top:1px dashed #c8c8c8;font:calc(var(--u) / 6)/1.6 "Courier Prime","Courier New",monospace;color:#777;text-align:right;padding-right:var(--u)}
.wr-ac{position:absolute;z-index:20;min-width:230px;max-width:360px;background:var(--bg);border-radius:14px;box-shadow:var(--sh-raise-lg);padding:6px;display:flex;flex-direction:column;animation:rise .14s var(--ease)}
.wr-ac button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:10px;font:13px/1.3 var(--f-script);color:var(--fg);cursor:pointer}
.wr-ac button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.wr-hint{font-size:12px;line-height:1.6;color:var(--faint);margin:12px 0 0;text-align:center}
@media (max-width:820px){
  .wr{grid-template-columns:1fr}.wr-side{display:none}
  .wr-bar{position:fixed;top:auto;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:29;padding:0;background:transparent}.wr-stat{display:none}
  .wr-types{box-shadow:var(--sh-raise);border-radius:999px}.wr-main{padding-bottom:70px;container-type:normal}
  .wr-paper{width:auto;padding:18px 14px 28px;border-radius:14px}
  .wr-doc{font-size:14px;line-height:1.45;min-height:60vh}
  .wr-doc .el{margin-left:0;width:auto;margin-top:.85em;min-height:1.45em}
  .wr-doc .el-h{margin-top:1.6em;padding-left:2.4em}.wr-doc .el-h::before{left:0}
  .wr-doc .el-c{margin-left:32%;width:auto}.wr-doc .el-d{margin-left:11%;width:78%;margin-top:0}.wr-doc .el-p{margin-left:20%;width:62%;margin-top:0}
  .wr-doc .el.pb{margin-top:2.2em}.wr-pg{font-size:12px;padding-right:6px}
}

/* Motion */
@keyframes clap{0%{transform:rotate(0)}35%{transform:rotate(-24deg)}62%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
@keyframes march{to{background-position:22px 0}}
@keyframes rec{50%{opacity:.35;transform:scale(.8)}}
@keyframes blink{50%{opacity:.35}}
@keyframes swap{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.96)}60%{transform:translateX(-50%) translateY(-2px) scale(1.01)}100%{opacity:1;transform:translateX(-50%)}}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
@keyframes drawer{from{transform:translateX(-24px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* Phone: Celtx-style slide-in menu, floating bottom bar, solid selected row */
@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100%;--appbar-h:58px}
  .appbar{position:sticky;top:0;z-index:25;padding:env(safe-area-inset-top,0px) 14px 0 14px;height:calc(var(--appbar-h) + env(safe-area-inset-top,0px))}
  .brand .logo{width:38px;height:38px}
  .brand b{font-size:21px}
  .side{display:none}
  .main{min-height:100vh}
  .top{padding-inline:16px;padding-top:4px;position:sticky;top:calc(var(--appbar-h) + env(safe-area-inset-top,0px));z-index:20;gap:8px}
  .top .tops{gap:8px;width:100%}
  .top .tops .sync{margin-right:auto}
  .top .btn.sm[data-ic]:not(.pri){font-size:0;gap:0;padding:0;width:38px;height:38px;border-radius:50%}
  .top .btn[data-ic]:not(.pri)::before{width:18px;height:18px}
  .content{padding-inline:16px;overflow:visible;padding-bottom:120px}
  .ph h1{font-size:26px}
  .search{width:100%}
  .savebar{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .savedpill{bottom:calc(144px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .bbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);border-radius:999px;box-shadow:var(--sh-raise-lg)}
  .bbar .cur{flex:1;font:700 14px/1.15 var(--f-display);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .msheet{position:fixed;inset:0;z-index:40;background:var(--veil);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);align-items:stretch}
  .msheet.open{display:flex;animation:fade .18s ease-out}
  .msheet .nav{background:var(--bg);width:min(88vw,360px);max-height:none;height:100%;border-radius:0 var(--r-xl) var(--r-xl) 0;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh-raise-lg);animation:drawer .28s var(--ease)}
  .msheet .nav::before{content:"ScriptDesk";display:block;font:800 22px/1 var(--f-display);letter-spacing:-.03em;color:var(--accent);padding:4px 12px 6px}
  .msheet .nav button{min-height:50px;padding:12px 14px;font-size:15.5px;border-radius:16px}
  .msheet .nav button[aria-current="page"]{background:var(--glass);color:var(--accent-ink);box-shadow:var(--sh-raise-sm),inset 0 1px 0 rgba(255,255,255,.35)}
  table.t{min-width:680px;font-size:12.5px}
  .kv{grid-template-columns:104px minmax(0,1fr)}
  .page .chr{padding-left:24%} .page .dia{padding-left:8%;padding-right:4%}
}

<script>
"use strict";
/* ================= Constants ================= */
const CDN={
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  xlsxStyle:'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js',

const STANDALONE=!(window.claude&&window.claude.use);

const LISTS={juniors:'Juniors / crowd',extras:'Extras',props:'Props',art:'Art / set dressing',makeup:'Makeup / hair',vehicles:'Vehicles',animals:'Animals',vfx:'VFX / CG',sfx:'SFX',spl_sets:'Special sets',spl_props:'Special props',equipment:'Special equipment',technicians:'Special technicians'};

const IE_RE=/^\s*(?:\d+[A-Z]?[.)]?\s+)?(INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|INT\s*\.\s*EXT|INT\s*-\s*EXT|I\s*\/\s*E|INT|EXT|EST)\b\.?\s*[\/\-–.]?\s*(.*)$/i;
const SCN_RE=/^\s*(?:SCENE|SCN|SC)\s*\.?\s*(?:NO|NUMBER|NUM|#)?\s*[.:#\-]*\s*(\d+(?:\s?[A-Z](?![A-Z]))?(?:\s*(?:&|,|AND|\/)\s*\d+(?:\s?[A-Z](?![A-Z]))?)*)(?![0-9])\s*[.:)\-–]*\s*(.*)$/i;

const NOT_CHAR=/^(CUT TO|FADE|DISSOLVE|INTERCUT|INTER CUT|CONTINUED|CONT'?D|THE END|BLACK|SONG|MONTAGE|SUPER|TITLE|FLASH ?BACK|BACK TO|END OF|INTERVAL|LATER|MORNING|NIGHT|DAY|EXT|INT|SCENE|SMASH CUT|MATCH CUT|V\.?O\.?|O\.?S\.?)\b/;
const PAGES=[
 {g:'Script',id:'write',nav:'Write script',t:'Write script'},
 {g:'Script',id:'script',nav:'Full script',t:'Full script'},
 {g:'Script',id:'structure',nav:'Story structure',t:'Story structure'},
 {g:'Script',id:'profiles',nav:'Character profiles',t:'Character profiles'},
 {g:'Single line order',id:'slo',nav:'Single line order',t:'Single line order'},
 {g:'Single line order',id:'sloLoc',nav:'Location-wise',t:'Location-wise single line order'},
 {g:'Single line order',id:'sloArt',nav:'Artist-wise',t:'Artist-wise single line order'},
 {g:'Single line order',id:'sloFight',nav:'Stunt / fight',t:'Stunt / fight single line order'},
 {g:'Lists',id:'locations',nav:'No. of locations',t:'No. of locations'},
 {g:'Lists',id:'artists',nav:'No. of artists',t:'No. of artists'},
 {g:'Lists',id:'locScenes',nav:'Location-wise scenes',t:'Location-wise scene list'},
 {g:'Lists',id:'artScenes',nav:'Artist-wise scenes',t:'Artist-wise scene list'},
 {g:'Breakdown',id:'breakdown',nav:'Script breakdown',t:'Script breakdown'},
 {g:'Breakdown',id:'special',nav:'Special identification',t:'Special identification'},
 {g:'Breakdown',id:'costume',nav:'Costume continuity',t:'Costume continuity'},
 {g:'Breakdown',id:'artprops',nav:'Art / props',t:'Art / props breakdown'},
 {g:'Shooting',id:'shots',nav:'Shot division',t:'Shot division'},
 {g:'Shooting',id:'sched',nav:'Shooting schedule',t:'Shooting schedule'},
 {g:'Shooting',id:'order',nav:'Shoot order',t:'Shoot order'},
 {g:'Shooting',id:'dood',nav:'Day out of days',t:'Day out of days'},
 {g:'Shooting',id:'callsheet',nav:'Call sheet',t:'Call sheet'},
 {g:'Shooting',id:'gear',nav:'Camera & equipment',t:'Camera & equipment'}];
const PG=Object.fromEntries(PAGES.map(p=>[p.id,p]));
const LSKEY='scriptdesk.v2.';

/* ================= Utilities ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,8);
const U=s=>String(s||'').trim().toUpperCase();
const norm=s=>U(s).replace(/\(.*?\)/g,'').replace(/[^A-Z0-9ऀ-෿ ]+/g,' ').replace(/\s+/g,' ').trim();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const today=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
function lsGet(k){try{const v=localStorage.getItem(LSKEY+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LSKEY+k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(LSKEY+k)}catch(e){}}
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3800)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')&&loadScript.done[src])return res();const s=document.createElement('script');s.src=src;s.onload=()=>{loadScript.done[src]=1;res()};s.onerror=()=>rej(new Error('Could not load a required component. Check your connection and try again.'));document.head.appendChild(s)})}
loadScript.done={};
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 9;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function natKey(no){const m=String(no||'').match(/(\d+)\s*([A-Z]?)/i);return m?(+m[1])*100+(m[2]?m[2].toUpperCase().charCodeAt(0)-64:0):999999}
function cleanItem(x){return String(x??'').replace(/\s+/g,' ').replace(/,/g,' /').trim()}
function splitList(t){return String(t||'').split(/\s*[,;\n]\s*/).map(s=>s.trim()).filter(s=>s&&s!=='—'&&s!=='-')}
function uniq(arr){const seen=new Set();return arr.filter(x=>{const k=String(x).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function byteLen(s){return new TextEncoder().encode(s).length}
function cutBytes(s,max){if(byteLen(s)<=max)return s;let lo=0,hi=s.length;while(lo<hi){const mid=(lo+hi+1)>>1;if(byteLen(s.slice(0,mid))<=max)lo=mid;else hi=mid-1}return s.slice(0,lo)}

/* ================= State ================= */
let P=null;                 // open project
let page=lsGet('page')||'slo';
const VIEW=lsGet('views')||{};
const AI={sample:null,limits:null};
let DB=null,UID=null,cloudOK=false;
let JOB=null;
const undoStack=[];

/* ================= Model ================= */
function newScene(o){return Object.assign({id:uid(),no:'',ie:'',time:'',loc:'',timeline:'',heading:'',text:'',title:'',desc:'',setup:'',artists:[],costumes:[],fight:null,song:null,notes:'',status:'new',flags:[],locked:{},cues:[]},blankLists(),o||{})}
function blankLists(){const o={};LK.forEach(k=>o[k]=[]);return o}
function newProject(o){return Object.assign({id:uid(),v:2,title:'Untitled film',production:'',front:'',scenes:[],artists:[],profiles:{},structure:null,changes:[],created:Date.now(),updated:Date.now(),sample:false},o||{})}
const eff=s=>[U(s.ie),U(s.time)].filter(Boolean).join(' / ');
const isNight=s=>/NIGHT|MIDNIGHT/.test(U(s.time));
const A=id=>P.artists.find(a=>a.id===id);
const aName=id=>{const a=A(id);return a?a.name:''};
function findArtist(n){const k=norm(n);if(!k)return null;return P.artists.find(a=>norm(a.name)===k||(a.aliases||[]).some(x=>norm(x)===k))||null}
function addArtist(name,tier,flag){const a={id:uid(),name:U(name).replace(/\s+/g,' '),aliases:[],designation:'',tier:tier||'Secondary',actor:'',phone:'',flag:flag||''};P.artists.push(a);dirty.meta=true;return a}
function cleanCastName(n){return U(String(n||'').replace(/\(.*?\)/g,' ').replace(/\s+(ON|OVER|THROUGH|IN|FROM)\s+(THE\s+|A\s+)?(PHONE|MOBILE|CELL|CELLPHONE|SCREEN|TV|LAPTOP|RADIO|SPEAKER|VIDEO CALL|CALL|INTERCOM)\b.*$/i,'').replace(/\s*[-–:]\s*(V\.?O\.?|O\.?S\.?|ON PHONE|ON MOBILE)$/i,'').replace(/\s+/g,' ').trim())}
function namesToIds(list,flag){const ids=[];list.forEach(n=>{n=cleanCastName(n);if(!n||!looksLikeName(n))return;let a=findArtist(n);if(!a)a=addArtist(n,'Secondary',flag||'');if(!ids.includes(a.id))ids.push(a.id)});return ids}
function artistScenes(id){return P.scenes.filter(s=>s.artists.includes(id))}
function crowdText(s){return s.juniors.join(', ')}
function sortedArtists(){const cnt={};P.scenes.forEach(s=>s.artists.forEach(id=>cnt[id]=(cnt[id]||0)+1));
  return P.artists.slice().sort((a,b)=>(a.tier==='Primary'?0:1)-(b.tier==='Primary'?0:1)||(cnt[b.id]||0)-(cnt[a.id]||0)||a.name.localeCompare(b.name)).map(a=>Object.assign({n:cnt[a.id]||0},a))}
function locGroups(){const m=new Map();P.scenes.forEach(s=>{const k=U(s.loc)||'(NO LOCATION)';if(!m.has(k))m.set(k,{loc:k,scenes:[],ie:new Set(),tm:new Set()});const g=m.get(k);g.scenes.push(s);if(s.ie)g.ie.add(U(s.ie));if(s.time)g.tm.add(U(s.time))});return [...m.values()]}

/* ================= Persistence ================= */
const dirty={meta:false,draft:false,scenes:new Set(),deleted:new Set()};
let flushT=null,flushing=false;
function touch(sceneIds){if(!P)return;P.updated=Date.now();dirty.meta=true;(sceneIds||[]).forEach(id=>dirty.scenes.add(id));
  saveLocal();clearTimeout(flushT);flushT=setTimeout(flush,1200);setSync('busy','Saving…')}
function saveLocal(){if(!P)return;const snap=JSON.parse(JSON.stringify(P));const ok=lsSet('p.'+P.id,snap);updateIndexLocal();IDB.set('p.'+P.id,snap).then(ok2=>{if(!ok&&!ok2&&!cloudOK)setSync('err','Not saved: device storage is full or blocked')})}
function idxEntry(){return {id:P.id,title:P.title,production:P.production,updated:P.updated,scenes:P.scenes.length,sample:!!P.sample}}
function updateIndexLocal(){const idx=(lsGet('index')||[]).filter(x=>x.id!==P.id);idx.unshift(idxEntry());lsSet('index',idx)}
const DRAFT_CH=60000;
function metaBody(){const {scenes,draft,...m}=P;m.order=scenes.map(s=>s.id);m.draftN=draft?Math.ceil(JSON.stringify(draft).length/DRAFT_CH):0;return JSON.parse(JSON.stringify(m))}
function base(){return 'data/users/'+UID}
async function flush(){if(!P)return;if(!cloudOK){dirty.meta=false;dirty.draft=false;dirty.scenes.clear();dirty.deleted.clear();setSync('ok','Saved on this device');return}
  if(flushing){clearTimeout(flushT);flushT=setTimeout(flush,800);return}
  flushing=true;setSync('busy','Saving…');const pid=P.id,proj=P;
  try{
    const pdoc=DB.collection(base()).doc('p_'+pid);
    const sids=[...dirty.scenes];dirty.scenes.clear();const dels=[...dirty.deleted];dirty.deleted.clear();
    for(const sid of sids){const s=proj.scenes.find(x=>x.id===sid);if(!s)continue;await writeDoc(pdoc.collection('scenes').doc(sid),JSON.parse(JSON.stringify(s)))}
    for(const sid of dels){await pdoc.collection('scenes').doc(sid).delete().catch(()=>{})}
    if(dirty.draft&&proj.draft){dirty.draft=false;const js=JSON.stringify(proj.draft);const n=Math.ceil(js.length/DRAFT_CH)||1;for(let i=0;i<n;i++)await writeDoc(pdoc.collection('draft').doc('c'+i),{s:js.slice(i*DRAFT_CH,(i+1)*DRAFT_CH)});dirty.meta=true}
    if(dirty.meta||sids.length){dirty.meta=false;await writeDoc(pdoc,metaBody());await saveCloudIndex()}
    setSync('ok','Saved to your account')
  }catch(e){
    if(e&&e.code==='quota_exceeded'){setSync('err','Account storage full. Delete an old project.')}
    else if(e&&e.code==='invalid_argument'&&/256|large|size/i.test(e.message||'')){setSync('err','A scene is too large to sync. Split it in Full script.')}
    else{setSync('err','Saved on this device. Account sync will retry.');proj.scenes.forEach(s=>dirty.scenes.add(s.id));dirty.meta=true;if(proj.draft)dirty.draft=true;clearTimeout(flushT);flushT=setTimeout(flush,15000)}
  }finally{flushing=false}}
async function writeDoc(ref,body){for(let i=0;i<2;i++){try{await ref.set(body);await sleep(40);return}catch(e){if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&i===0){await sleep(1500+Math.random()*800);continue}throw e}}}
async function cloudIndex(){if(!cloudOK)return [];try{const d=await DB.collection(base()).doc('index').get();return d.exists&&Array.isArray(d.data().projects)?d.data().projects:[]}catch(e){return []}}
async function saveCloudIndex(){if(!cloudOK)return;const list=(await cloudIndex()).filter(x=>x.id!==P.id);list.unshift(idxEntry());await writeDoc(DB.collection(base()).doc('index'),{projects:list.slice(0,200)})}
async function listProjects(){const local=lsGet('index')||[];const cloud=await cloudIndex();const m=new Map();[...cloud,...local].forEach(x=>{const e=m.get(x.id);if(!e||x.updated>e.updated)m.set(x.id,x)});return [...m.values()].sort((a,b)=>b.updated-a.updated)}
async function loadProject(id){let local=lsGet('p.'+id);const il=await IDB.get('p.'+id);if(il&&(!local||il.updated>=local.updated))local=il;let cloud=null;
  if(cloudOK){try{const pdoc=DB.collection(base()).doc('p_'+id);const m=await pdoc.get();
    if(m.exists){const meta=m.data();const qs=await pdoc.collection('scenes').limit(1000).get();const byId={};qs.docs.forEach(d=>byId[d.id]=d.data());
      const scenes=(meta.order||Object.keys(byId)).map(i=>byId[i]).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));
      cloud=Object.assign(JSON.parse(JSON.stringify(meta)),{scenes});delete cloud.order;
      if(meta.draftN){let js='';for(let i=0;i<meta.draftN;i++){const d=await pdoc.collection('draft').doc('c'+i).get();js+=d.exists?d.data().s:''}try{cloud.draft=JSON.parse(js)}catch(e){}}delete cloud.draftN}}catch(e){}}
  let pick=cloud&&(!local||cloud.updated>=local.updated)?cloud:local;if(!pick)return null;
  pick=upgrade(pick);
  if(cloudOK&&local&&(!cloud||local.updated>cloud.updated)){P=pick;dirty.meta=true;if(pick.draft)dirty.draft=true;pick.scenes.forEach(s=>dirty.scenes.add(s.id));setTimeout(flush,500)}
  return pick}
function upgrade(p){p=Object.assign(newProject(),p);p.scenes=(p.scenes||[]).map(s=>{const n=newScene(s);LK.forEach(k=>{if(!Array.isArray(n[k]))n[k]=[]});if(!Array.isArray(n.artists))n.artists=[];if(!Array.isArray(n.costumes))n.costumes=[];if(!n.locked)n.locked={};if(!Array.isArray(n.flags))n.flags=[];return n});p.artists=p.artists||[];p.profiles=p.profiles||{};p.changes=Array.isArray(p.changes)?p.changes:[];return p}
async function deleteProject(id){lsDel('p.'+id);await IDB.del('p.'+id);lsSet('index',(lsGet('index')||[]).filter(x=>x.id!==id));
  if(cloudOK){try{const pdoc=DB.collection(base()).doc('p_'+id);const qs=await pdoc.collection('scenes').limit(1000).get();for(const d of qs.docs){await pdoc.collection('scenes').doc(d.id).delete()}await pdoc.delete();const list=(await cloudIndex()).filter(x=>x.id!==id);await writeDoc(DB.collection(base()).doc('index'),{projects:list})}catch(e){}}}
function setSync(cls,msg){const el=$('#sync');el.className='sync '+cls;el.lastElementChild.textContent=msg}

/* ================= Undo ================= */
function snapshot(){if(!P)return;undoStack.push(JSON.stringify(P));if(undoStack.length>40)undoStack.shift();$('#bUndo').disabled=false}
function undo(){if(!undoStack.length)return;const prev=JSON.parse(undoStack.pop());const before=new Map(P.scenes.map(s=>[s.id,JSON.stringify(s)]));
  P.scenes.forEach(s=>{if(!prev.scenes.find(x=>x.id===s.id))dirty.deleted.add(s.id)});
  prev.scenes.forEach(s=>{if(before.get(s.id)!==JSON.stringify(s))dirty.scenes.add(s.id)});
  const keepLog=P.changes;P=upgrade(prev);P.changes=keepLog;logChange('Last edit undone','scenes',true);touch([]);$('#bUndo').disabled=!undoStack.length;render();toast('Undone')}

/* ================= Script parsing (local) ================= */
function parseRest(rest){let r=' '+U(rest).replace(/[–—]/g,'-')+' ';let time='';let note='';
  const ic=r.match(/[,(]?\s*(INTER ?CUTS?(?: OF| WITH)?[^,)]*)\)?/);if(ic){note=ic[1].trim();r=r.replace(ic[0],' ')}
  for(const t of TIMES){const re=new RegExp('(^|[\\s\\-/.,(])'+t.replace(/ /g,'\\s+')+'(?=$|[\\s\\-/.,)])');const m=r.match(re);if(m){time=t;r=r.slice(0,m.index)+m[1]+' '+r.slice(m.index+m[0].length);break}}
  let loc=r.replace(/\s+\d+[A-Z]?\s*$/,'').replace(/^[\s\-\/.,:]+|[\s\-\/.,:]+$/g,'').replace(/\s*-\s*$/,'').replace(/\s{2,}/g,' ').replace(/\s+-\s+-\s+/g,' - ').trim();

  P.front=sw(P.front);

/* Keep a scene's artists in step with its dialogue after a script edit (no AI needed) */
function syncSceneCast(sc,oldCues){const now=sc.cues||[];const gone=(oldCues||[]).filter(c=>!now.some(n=>norm(n)===norm(c)));const added=now.filter(c=>!(oldCues||[]).some(o=>norm(o)===norm(c)));
  if(added.length)sc.artists=uniq([...sc.artists,...namesToIds(uniq(added.map(c=>U(c).replace(/\((V\.?O\.?|O\.?S\.?|CONT'?D)\)/ig,'').replace(/\s+TO\s+.*$/,'').trim()).filter(Boolean)),'Added from script')]);
  gone.forEach(g=>{const a=findArtist(g);if(!a)return;const names=[a.name,...(a.aliases||[])];const still=names.some(n=>new RegExp('(^|[^\\p{L}\\p{N}_])'+reEsc(n)+'(?![\\p{L}\\p{N}_])','iu').test(sc.text));if(!still)sc.artists=sc.artists.filter(x=>x!==a.id)})}
/* Which speaker name was swapped for another? Compares the cue lines in order. */
function cueSwap(oldText,newText){const seq=t=>classify(t.split('\n')).filter(([k])=>k==='chr').map(([,t])=>cueOf(t)).filter(Boolean);
  const a=seq(oldText),b=seq(newText);const pairs=new Map();
  if(a.length===b.length){a.forEach((x,i)=>{if(norm(x)!==norm(b[i]))pairs.set(norm(x)+'>'+norm(b[i]),[x,b[i]])})}
  else{const gone=uniq(a).filter(x=>!b.some(y=>norm(y)===norm(x))),add=uniq(b).filter(y=>!a.some(x=>norm(x)===norm(y)));if(gone.length===1&&add.length===1)pairs.set('g',[gone[0],add[0]])}
  if(pairs.size!==1)return null;const [o,n]=[...pairs.values()][0];const art=findArtist(o);if(!art)return null;const other=findArtist(n);if(other&&other.id!==art.id)return null;return {a:art,from:o,to:U(n)}}

  const kids=[...d.children];const els=kids.map(el=>({t:el.dataset.t,x:el.textContent,n:el.dataset.no}));const nums=wrNumbers(els);
  let line=0,page=1;const LP=54;const marks=[];const cur=wrCur();
  kids.forEach((el,i)=>{const t=el.dataset.t;if(t==='h')el.dataset.n=nums[i];else delete el.dataset.n;
    el.classList.toggle('wr-empty',!el.textContent.length);
    const txt=el.textContent||' ';const lines=txt.split('\n').reduce((a,p)=>a+Math.max(1,Math.ceil(p.length/W_CPL[t])),0);

  const side=$('#wrScenes');if(side){const hs=kids.map((el,i)=>[el,i]).filter(([el])=>el.dataset.t==='h');const curH=(()=>{let h=null;for(const el of kids){if(el.dataset.t==='h')h=el;if(el===cur)break}return h})();
    side.innerHTML=hs.length?hs.map(([el,i])=>`<button data-wrgo="${i}" aria-current="${el===curH}"><b>${esc(nums[i])}</b><span>${esc(U(el.textContent.trim())||'(new scene)')}</span></button>`).join(''):'<p class="small muted" style="margin:6px">Scene headings appear here.</p>'}
  const words=(d.textContent.match(/\S+/g)||[]).length;const sc=kids.filter(el=>el.dataset.t==='h').length;const cnt=$('#wrCount');if(cnt)cnt.textContent=`${sc} scene${sc===1?'':'s'} · about ${page} page${page===1?'':'s'} · ${words} words`;

function wrBarSync(){const b=wrCur();const t=b?b.dataset.t:null;document.querySelectorAll('[data-wrt]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.wrt===t?'true':'false'));

/* ---- Autocomplete: character names, INT./EXT., locations, times ---- */
function wrNames(){const cnt={};const add=(n,w)=>{n=U(n).replace(/\s*\((V\.?O\.?|O\.?S\.?|O\.?C\.?|CONT'?D)\)\s*$/,'').trim();if(n)cnt[n]=(cnt[n]||0)+w};
  [...(wrDoc()||{children:[]}).children].forEach(el=>{if(el.dataset.t==='c'&&el!==wrCur())add(el.textContent,3)});(P.artists||[]).forEach(a=>add(a.name,1));
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])}
function wrLocs(){const cnt={};const add=l=>{l=U(l).trim();if(l)cnt[l]=(cnt[l]||0)+1};
  [...(wrDoc()||{children:[]}).children].forEach(el=>{if(el.dataset.t!=='h'||el===wrCur())return;const p=parseIE(U(el.textContent));if(p&&p.loc)add(p.loc)});(P.scenes||[]).forEach(s=>add(s.loc));

function wrSuggest(){const b=wrCur();hideAC();if(!b)return;const t=b.dataset.t;const txt=b.textContent;if(caretOff(b)<txt.length)return;const u=U(txt);let list=[],rep=0,after='';
  if(t==='c'){const pre=u.trim();if(!pre)return;list=wrNames().filter(n=>n.startsWith(pre)&&n!==pre)}
  else if(t==='h'){
    const m=u.match(/^(INT\.\/EXT\.|EXT\.\/INT\.|INT\/EXT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)(\s+)(.*)$/);
    if(!m){const pre=u.trim();list=W_IE.filter(x=>x.startsWith(pre)&&x!==pre);after=' '}
    else{const rest=m[3];const dm=rest.match(/^(.*?)\s+-\s+([A-Z ]*)$/);

  const main=$('#wrMain');main.appendChild(box);const br=b.getBoundingClientRect(),mr=main.getBoundingClientRect();
  box.style.top=(br.bottom-mr.top+6)+'px';box.style.left=Math.max(0,Math.min(br.left-mr.left,mr.width-240))+'px';

function moveAC(d){const a=WR.ac;if(!a)return;a.i=(a.i+d+a.list.length)%a.list.length;document.querySelectorAll('#wrAc [data-i]').forEach(x=>x.setAttribute('aria-selected',+x.dataset.i===a.i?'true':'false'))}

/* ---- Keys ---- */

    if(!e.shiftKey&&(t==='c'||t==='d')&&b.textContent.trim()&&caretOff(b)>=b.textContent.length){const nb=mkBlock('p','');b.after(nb);setText(nb,'()');placeCaret(nb,1);wrTouch(true);wrBarSync();return}

/* ---- Page ---- */

function wrMount(){const d=wrDoc();if(!d)return;const D=draft();WR.hist=[];WR.redo=[];

function wrOpen(){const inp=document.createElement('input');inp.type='file';inp.accept='.fountain,.fdx,.txt,.docx,.pdf,.text';inp.onchange=async()=>{const file=inp.files[0];if(!file)return;

SCENES (key | scene no | INT/EXT | time | location | length | cast | crowd | special):

  if(k==='cs'){const d=dayById(el.dataset.day),f=el.dataset.cf;if(!d)return null;d.cs=d.cs||{};const shown=csData(d).v(f);if((d.cs[f]||'')===v||(!d.cs[f]&&v===shown))return null;snapshot();d.cs[f]=v;return {sids:[],desc:`Call sheet · ${dayLabel(d)} · edited`}}
