  if(st===429)return {code:'rate_limited',message:m,wait:ra};if(st===400&&/max_tokens|max_completion_tokens|maximum context|context length|too many tokens/i.test(m))return {code:'max_tokens',message:m};if(st===413)return {code:'prompt_too_large',message:m};
  if(st===402||/credit|balance|billing|quota exceeded for metric.*free/i.test(m))return {code:st===402?'no_credit':'rate_limited',message:m,wait:ra};
  if(st===404||(st===400&&/model/i.test(m)))return {code:'bad_model',message:m};return {code:'upstream_error',message:m}}
async function callOnce(prompt,opts,c,p){const prov=c.provider;const key=c.keys[prov]||'';const base=(c.base[prov]||p.base).replace(/\/+$/,'');const tier=opts.modelTier||'default';
  const mc=c.model[prov]||{};const model=(tier==='complex'?(mc.complex||mc.default):tier==='quick'?(mc.quick||mc.default):mc.default)||p.models[tier]||p.models.default;
  if(!model)throw {code:'no_model'};
  const imgs=[];if(opts.images){for(const b of Array.from(opts.images.length!=null?opts.images:[opts.images]))imgs.push({mime:/png/.test(b.type)?'image/png':'image/jpeg',data:await blobB64(b)})}
  const maxOut=Math.min(opts.maxOut||99999,p.maxOut||(tier==='quick'?4000:16000));let r;
  try{
    if(prov==='claude'){r=await fetch(base+'/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model,max_tokens:maxOut,messages:[{role:'user',content:[...imgs.map(i=>({type:'image',source:{type:'base64',media_type:i.mime,data:i.data}})),{type:'text',text:prompt}]}]})})}
    else if(prov==='gemini'){r=await fetch(`${base}/v1beta/models/${encodeURIComponent(model.replace(/^models\//,''))}:generateContent`,{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{role:'user',parts:[...imgs.map(i=>({inline_data:{mime_type:i.mime,data:i.data}})),{text:prompt}]}],generationConfig:Object.assign({maxOutputTokens:maxOut,temperature:0.2},opts.json?{responseMimeType:'application/json'}:{})})})}
    else if(prov==='ollama'||prov==='ollamacloud'){const h={'content-type':'application/json'};if(key)h.authorization='Bearer '+key;r=await fetch(base+'/api/chat',{method:'POST',signal:opts.signal,headers:h,
      body:JSON.stringify(Object.assign({model,stream:false,messages:[Object.assign({role:'user',content:prompt},imgs.length?{images:imgs.map(i=>i.data)}:{})],options:Object.assign({temperature:0.2},prov==='ollama'?{num_ctx:16384}:{})},opts.json?{format:'json'}:{}))})}
    else{const h={'content-type':'application/json'};if(key)h.authorization='Bearer '+key;if(prov==='openrouter'){h['HTTP-Referer']='https://github.com/MVMK1903/SCRIPT.DESK';h['X-Title']='ScriptDesk'}
      r=await fetch(base+'/chat/completions',{method:'POST',signal:opts.signal,headers:h,body:JSON.stringify(Object.assign({model,max_tokens:maxOut,temperature:0.2,
        messages:[{role:'user',content:imgs.length?[{type:'text',text:prompt},...imgs.map(i=>({type:'image_url',image_url:{url:`data:${i.mime};base64,${i.data}`}}))]:prompt}]},opts.json&&p.jsonMode?{response_format:{type:'json_object'}}:{}))})}}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};if(navigator.onLine!==false&&STANDALONE&&!NATIVE&&!/Electron/.test(navigator.userAgent)&&!/localhost|127\.0\.0\.1/.test(base)&&!['claude','gemini','groq','openrouter'].includes(prov))throw {code:'cors_blocked',svc:p.name};if(prov==='ollama'||prov==='custom'&&/localhost|127\.0\.0\.1/.test(base))throw {code:prov==='ollama'?'ollama_down':'upstream_error'};throw {code:navigator.onLine===false?'offline':'upstream_error'}}
  if(!r.ok)throw await httpErr(r,prov);
  const j=await r.json();let text='',trunc=false;
  if(prov==='claude'){text=(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');trunc=j.stop_reason==='max_tokens'}
  else if(prov==='gemini'){if(j.promptFeedback&&j.promptFeedback.blockReason)throw {code:'refused'};const cd=(j.candidates||[])[0]||{};text=((cd.content||{}).parts||[]).map(x=>x.text||'').join('');trunc=cd.finishReason==='MAX_TOKENS';if(cd.finishReason==='SAFETY')throw {code:'refused'}}
  else if(prov==='ollama'||prov==='ollamacloud'){if(j.error)throw {code:'upstream_error',message:String(j.error)};text=(j.message||{}).content||'';trunc=j.done_reason==='length'}
  else{const ch=(j.choices||[])[0]||{};text=(ch.message||{}).content||'';trunc=ch.finish_reason==='length';if(j.error)throw {code:'upstream_error',message:String(j.error.message||j.error)}}
  text=text.replace(/<think>[\s\S]*?<\/think>/g,'');if(!text.trim())throw {code:'empty_completion'};return {text,truncated:trunc,modelTierApplied:tier}}
async function aiCall(prompt,opts){opts=opts||{};const c=aiCfg(),p=PROVIDERS[c.provider];if(!p)throw {code:'no_key'};
  if(p.key&&c.provider!=='custom'&&!c.keys[c.provider])throw {code:'no_key'};
  if(c.provider!=='ollama'&&!/localhost|127\.0\.0\.1/.test(c.base[c.provider]||p.base)&&navigator.onLine===false)throw {code:'offline'};
  for(let attempt=0;;attempt++){try{return await callOnce(prompt,opts,c,p)}catch(e){
    if(e&&e.code==='max_tokens'&&!opts._small){opts=Object.assign({},opts,{maxOut:4096,_small:1});continue}
    if(e&&(e.code==='rate_limited'||e.code==='upstream_error')&&attempt<4&&!(opts.signal&&opts.signal.aborted)){
      const wait=Math.min(90,Math.max(e.wait||0,e.code==='rate_limited'?20*(attempt+1):5*(attempt+1)));
      if(JOB){const old=JOB.label;JOB.label=e.code==='rate_limited'?`Free-tier limit reached, waiting ${wait}s`:'Connection hiccup, retrying';renderJob();await sleepAbort(wait*1000,opts.signal);JOB.label=old;renderJob()}else await sleepAbort(wait*1000,opts.signal);continue}
    throw e}}}
const anthropicCall=aiCall;
function parseLooseJSON(t){try{return JSON.parse(t)}catch(e){}const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=[t.indexOf('{'),t.indexOf('[')].filter(i=>i>=0);const b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a.length&&Math.min(...a)<b){try{return JSON.parse(t.slice(Math.min(...a),b+1))}catch(e){}}throw {code:'invalid_json',text:t}}
function standaloneSampler(){const f=(p,o)=>aiCall(typeof p==='string'?p:p.map(m=>m.content).join('\n\n'),o);
  f.json=async(p,o)=>{const r=await aiCall((typeof p==='string'?p:p.map(m=>m.content).join('\n\n'))+'\n\nYour reply will be machine-parsed: reply with the JSON only, in valid json.',Object.assign({},o,{json:true}));if(r.truncated)throw {code:'invalid_json',text:r.text};return parseLooseJSON(r.text)};
  f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:4,maxInputBytes:20000000,mediaTypes:['image/jpeg','image/png']}});return f}
function refreshAI(){if(aiReady()){AI.sample=standaloneSampler();AI.limits={images:{maxCount:4}}}else{AI.sample=null;AI.limits=null}syncTop()}
async function listModels(c){const prov=c.provider,p=PROVIDERS[prov],key=c.keys[prov]||'',base=(c.base[prov]||p.base).replace(/\/+$/,'');let r;
  try{if(prov==='claude')r=await fetch(base+'/v1/models?limit=100',{headers:{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});
    else if(prov==='gemini')r=await fetch(base+'/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':key}});
    else if(prov==='ollama')r=await fetch(base+'/api/tags');
    else if(prov==='ollamacloud')r=await fetch(base+'/api/tags',{headers:key?{authorization:'Bearer '+key}:{}});
    else r=await fetch(base+'/models',{headers:key?{authorization:'Bearer '+key}:{}})}
  catch(e){throw {code:prov==='ollama'?'ollama_down':navigator.onLine===false?'offline':!NATIVE&&!/Electron/.test(navigator.userAgent)&&!/localhost|127\.0\.0\.1/.test(base)&&!['claude','gemini','groq','openrouter'].includes(prov)?'cors_blocked':'upstream_error'}}
  if(!r.ok)throw await httpErr(r,prov);const j=await r.json();
  if(prov==='gemini')return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).filter(n=>!/embed|aqa|imagen|tts|image/i.test(n));
  if(prov==='ollama'||prov==='ollamacloud')return (j.models||[]).map(m=>m.name||m.model).filter(Boolean);
  let ids=(j.data||[]).map(m=>m.id);if(prov==='openrouter'){const free=ids.filter(i=>/:free$/.test(i));if(free.length)ids=free}return ids}
function openSettings(note){const c=aiCfg();const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);const installed=matchMedia('(display-mode: standalone)').matches||NATIVE;let cur=c.provider;
  openModal(`<div class="modal-h"><h2>Settings</h2><button class="btn ghost" data-close>Close</button></div><div class="modal-b">
  ${note?`<div class="banner">${esc(note)}</div>`:''}
  <div class="fieldbox"><label for="sProv">AI service</label><select id="sProv" style="background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:7px 10px">${Object.entries(PGROUPS).map(([g,gl])=>`<optgroup label="${esc(gl)}">${Object.entries(PROVIDERS).filter(([,v])=>v.group===g).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${esc(v.name)}  —  ${esc(v.tag)}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div id="sBody"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn pri" id="sSave">Save</button><button class="btn" id="sTest">Test</button><span class="small" id="sMsg"></span></div>
  <p class="small muted">The AI is used only for finding scenes, the breakdown, character profiles, story structure and reading scanned pages. Keys are stored only on this device. Everything else in ScriptDesk is free, open source and works offline.</p>
  <div class="banner info small" style="display:block;line-height:1.55"><b>Have a Claude subscription?</b> Apps outside Claude can only reach Claude with an API key. To use your subscription instead, open ScriptDesk inside Claude: <a href="https://claude.ai/artifact/E9UvNpxLmvFjyudnWrKGs6" target="_blank" rel="noopener">Open ScriptDesk in Claude</a> (sign in with your Claude account).</div>
  ${installed?'':`<div class="banner info" style="margin-top:6px">${isIOS?'To install on iPhone or iPad: tap Share, then "Add to Home Screen".':'To install: use "Install app" at the top, or your browser menu → Install ScriptDesk / Add to Home screen.'}</div>`}
  </div>`);
  const msg=t=>{$('#sMsg').textContent=t};
  const body=()=>{const p=PROVIDERS[cur];const mc=c.model[cur]||{};
    $('#sBody').innerHTML=`<div class="banner info small" style="display:block;line-height:1.55">${p.help}${p.keyUrl?` <a href="${p.keyUrl}" target="_blank" rel="noopener">${cur==='ollama'?'Download Ollama':cur==='ollamacloud'?'Get a free Ollama key':'Get a key'}</a>`:''}</div>
    ${p.key?`<div class="fieldbox"><label for="sKey">API key${cur==='custom'?' (if needed)':''}</label><input type="password" id="sKey" autocomplete="off" spellcheck="false" placeholder="${esc(p.keyHint||'')}" value="${esc(c.keys[cur]||'')}"></div>`:''}
    ${cur==='ollama'||cur==='custom'||p.editBase?`<div class="fieldbox"><label for="sBase">Address</label><input type="text" id="sBase" value="${esc(c.base[cur]||p.base)}"></div>`:''}
    <div class="two"><div class="fieldbox"><label for="sModel">Model</label><input type="text" id="sModel" list="sModels" placeholder="${esc(p.models.default||'press Load models')}" value="${esc(mc.default||'')}"></div>
    <div class="fieldbox"><label for="sModel2">Model for profiles &amp; structure (optional)</label><input type="text" id="sModel2" list="sModels" placeholder="same as Model" value="${esc(mc.complex||'')}"></div></div>
    <datalist id="sModels"></datalist><div><button class="btn sm" id="sLoad">Load models</button> <span class="small muted" id="sLoadMsg"></span></div>`;
    $('#sLoad').onclick=async()=>{collect();$('#sLoadMsg').textContent='Loading…';try{const ids=await listModels(c);$('#sModels').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');$('#sLoadMsg').textContent=ids.length?`${ids.length} models found. Click the Model box to pick one.`:'No models found.';if(ids.length&&!$('#sModel').value)$('#sModel').value=ids[0]}catch(e){$('#sLoadMsg').textContent=errMsg(e)}}};
  const collect=()=>{c.provider=cur;const k=$('#sKey');if(k)c.keys[cur]=k.value.trim();const b=$('#sBase');if(b)c.base[cur]=b.value.trim();c.model[cur]={default:$('#sModel').value.trim(),complex:$('#sModel2').value.trim()};};
  body();
  $('#sProv').onchange=e=>{collect();cur=e.target.value;body();msg('')};
  $('#sSave').onclick=()=>{collect();lsSet('ai',c);refreshAI();msg(aiReady()?'Saved. AI is ready.':'Saved. '+(PROVIDERS[cur].key&&cur!=='custom'&&!c.keys[cur]?'Add a key to use AI.':'Press "Load models" and pick a model to use AI.'))};
  $('#sTest').onclick=async()=>{collect();lsSet('ai',c);refreshAI();msg('Testing…');try{await aiCall('Reply with the single word OK.',{modelTier:'quick'});msg('✓ Works.')}catch(e){msg(errMsg(e))}}}
let installEvt=null;

if(STANDALONE&&'serviceWorker' in navigator&&/^https:|^http:\/\/localhost|^http:\/\/127\./.test(location.href)&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

/* ================= Boot ================= */
(async function boot(){
  render();
  const lastId=lsGet('last');
  if(lastId){const p=await loadProject(lastId);if(p){P=p;render()}}
  if(!P){const idx=lsGet('index')||[];if(idx.length){const p=await loadProject(idx[0].id);if(p){P=p;render()}}}
  if(!P){P=sampleProject();saveLocal();render()}
  if(STANDALONE){AI.checked=true;$('#bSettings').hidden=false;refreshAI();setSync('ok',(navigator.onLine===false?'Offline · ':'')+'Saved on this device');syncTop();return}
  const [smp,db,usr]=await Promise.all([window.claude.use('sample').catch(()=>null),window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null)]);
  AI.sample=smp;AI.checked=true;if(smp){try{AI.limits=await smp.limits()}catch(e){AI.limits=null}}
  if(db&&usr){try{UID=await usr.id()}catch(e){UID=null}if(UID){DB=db;cloudOK=true}}
  setSync('ok',cloudOK?'Saved to your account':'Saved on this device');
  if(cloudOK){const cloud=await cloudIndex();const want=lsGet('last')||(cloud[0]&&cloud[0].id);
    if(want&&(!P||P.sample||P.id===want)){const p=await loadProject(want);if(p){P=p}}
