function openSettings(note){const c=aiCfg();const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);const installed=matchMedia('(display-mode: standalone)').matches||NATIVE;let cur=c.provider;
  openModal(`<div class="modal-h"><h2>Settings</h2><button class="btn ghost" data-close>Close</button></div><div class="modal-b">
  ${note?`<div class="banner">${esc(note)}</div>`:''}
  <div class="fieldbox"><label for="sProv">AI service</label><select id="sProv" style="background:var(--bg-2);border:1px solid var(--line);border-radius:5px;padding:7px 10px">${Object.entries(PGROUPS).map(([g,gl])=>`<optgroup label="${esc(gl)}">${Object.entries(PROVIDERS).filter(([,v])=>v.group===g).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${esc(v.name)}  —  ${esc(v.tag)}</option>`).join('')}</optgroup>`).join('')}</select></div>
  <div id="sBody"></div>
  <div class="pool-box"><h3>Your AI pool <span class="small muted">· several keys, switching automatically</span></h3>
    <p class="small muted" style="margin:0 0 8px;line-height:1.5">Fill in a service above, then press <b>Add to AI pool</b>. Add as many free keys as you like, even several for the same service. ScriptDesk uses the most accurate AI first, spreads work across equally good ones, and moves to the next one when a free limit is reached. Free allowances are never truly unlimited, but a pool of keys multiplies them.</p>
    <div id="sPool"></div>
    <div class="pool-opt"><label for="sMin" class="small">Only use AIs rated at least</label><select id="sMin"><option value="0">Any</option><option value="60">Decent · 60</option><option value="75">Good · 75</option><option value="85">High · 85</option><option value="90">Top only · 90</option></select><button class="btn sm" id="sTestAll">Test all</button></div>
    <p class="small muted" style="margin:6px 0 0">Ratings are an estimate from the model's size and family. If none of your AIs reaches the minimum, the best one you have is used.</p></div>
  <label class="small" style="display:flex;gap:10px;align-items:flex-start;line-height:1.5"><input type="checkbox" id="sThorough" ${thorough()?'checked':''} style="margin-top:3px"><span><b>Double-check every scene</b> (recommended for free and open-source AI). The AI reads each scene a second time and adds characters, props and details it missed. Takes about twice as long and uses more of a free allowance.</span></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn pri" id="sSave">Save</button><button class="btn" id="sAdd">Add to AI pool</button><button class="btn" id="sTest">Test</button><span class="small" id="sMsg"></span></div>
  <p class="small muted">The AI is used only for finding scenes, the breakdown, character profiles, story structure and reading scanned pages. Keys are stored only on this device. Everything else in ScriptDesk is free, open source and works offline.</p>
  <div class="banner info small" style="display:block;line-height:1.55"><b>Have a Claude subscription?</b> Apps outside Claude can only reach Claude with an API key. To use your subscription instead, open ScriptDesk inside Claude: <a href="https://claude.ai/artifact/E9UvNpxLmvFjyudnWrKGs6" target="_blank" rel="noopener">Open ScriptDesk in Claude</a> (sign in with your Claude account).</div>
  ${installed?'':`<div class="banner info" style="margin-top:6px">${isIOS?'To install on iPhone or iPad: tap Share, then "Add to Home Screen".':'To install: use "Install app" at the top, or your browser menu → Install ScriptDesk / Add to Home screen.'}</div>`}
  </div>`);
  const msg=t=>{$('#sMsg').textContent=t};
  const body=()=>{const p=PROVIDERS[cur];const mc=c.model[cur]||{};
    $('#sBody').innerHTML=`<div class="banner info small" style="display:block;line-height:1.55">${p.help}${p.keyUrl?` <a href="${p.keyUrl}" target="_blank" rel="noopener">${cur==='ollama'?'Download Ollama':cur==='ollamacloud'?'Get a free Ollama key':'Get a key'}</a>`:''}</div>
    ${p.key?`<div class="fieldbox"><label for="sKey">API key${cur==='custom'?' (if needed)':''}</label><input type="password" id="sKey" autocomplete="off" spellcheck="false" placeholder="${esc(p.keyHint||'')}" value="${esc(c.keys[cur]||'')}"></div>`:''}
    ${cur==='ollama'||cur==='custom'||p.editBase?`<div class="fieldbox"><label for="sBase">Address</label><input type="text" id="sBase" value="${esc(c.base[cur]||p.base)}"></div>`:''}
    <div class="two"><div class="fieldbox"><label for="sModel">Model</label><input type="text" id="sModel" list="sModels" placeholder="${esc(p.models.default||'press Load models')}" value="${esc(mc.default||'')}"></div>
    <div class="fieldbox"><label for="sModel2">Model for profiles &amp; structure (optional)</label><input type="text" id="sModel2" list="sModels" placeholder="same as Model" value="${esc(mc.complex||'')}"></div></div>
    <datalist id="sModels"></datalist><div><button class="btn sm" id="sLoad">Load models</button> ${p.key&&cur!=='custom'?'<button class="btn sm" id="sCheck">Check free vs paid</button> ':''}<span class="small muted" id="sLoadMsg"></span></div><div id="sChk"></div>`;
    $('#sLoad').onclick=async()=>{collect();$('#sLoadMsg').textContent='Loading…';try{const ids=await listModels(c);$('#sModels').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');$('#sLoadMsg').textContent=ids.length?`${ids.length} models found.`+(p.probe?'':' Click the Model box to pick one.'):'No models found.';if(ids.length&&!$('#sModel').value)$('#sModel').value=ids[0];if(ids.length&&p.probe)runCheck(ids)}catch(e){$('#sLoadMsg').textContent=errMsg(e)}};
    const ck=$('#sCheck');if(ck)ck.onclick=async()=>{collect();$('#sLoadMsg').textContent='Loading…';try{const ids=await listModels(c);$('#sModels').innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');if(!ids.length){$('#sLoadMsg').textContent='No models found.';return}runCheck(ids)}catch(e){$('#sLoadMsg').textContent=errMsg(e)}};
    chkUI()};
  /* Free vs paid: send one tiny test request per model and sort the models by what this key can actually use */
  const ckey=()=>cur+':'+(c.keys[cur]||'').slice(-6)+':'+(c.base[cur]||'');
  const chkUI=()=>{const el=$('#sChk');if(!el)return;const r=(c.checks||{})[ckey()];if(!r){el.innerHTML='';return}
    const chip=(m,cls)=>`<button type="button" class="mchip ${cls}" data-m="${esc(m)}" title="rating ${accScore({provider:cur,model:m})}">${esc(m)}</button>`,dead=m=>`<span class="mchip paid">${esc(m)}</span>`,na=m=>`<span class="mchip na">${esc(m)}</span>`;
    el.innerHTML=`<div class="mgrp free"><h4>Free with your key <span>${r.free.length}</span></h4><div>${r.free.map(m=>chip(m,'free')).join('')||'<span class="small muted">None found. Try again later if a limit was hit.</span>'}</div></div>`+
      (r.busy.length?`<div class="mgrp"><h4>Limit hit while checking, probably free <span>${r.busy.length}</span></h4><div>${r.busy.map(m=>chip(m,'busy')).join('')}</div></div>`:'')+
      (r.paid.length?`<div class="mgrp paid"><h4>Needs a paid plan <span>${r.paid.length}</span></h4><div>${r.paid.map(dead).join('')}</div></div>`:'')+
      (r.err.length?`<div class="mgrp"><h4>Not available <span>${r.err.length}</span></h4><div>${r.err.map(na).join('')}</div></div>`:'')+
      '<p class="small muted" style="margin:6px 0 0">Tap a free model to use it. The test sends one tiny request per model, so it uses almost none of your allowance.</p>';
    el.onclick=ev=>{const b=ev.target.closest('button[data-m]');if(b){$('#sModel').value=b.dataset.m;$('#sLoadMsg').textContent='Selected '+b.dataset.m+'. Press Save or Add to AI pool.'}}};
  let checking=false;
  const runCheck=async ids=>{if(checking)return;checking=true;const prov=cur,key=ckey(),list=ids.slice(0,60),r={free:[],busy:[],paid:[],err:[],at:Date.now()};
    try{for(let i=0;i<list.length;i++){if(!$('#sChk')||cur!==prov){return}$('#sLoadMsg').textContent=`Checking which are free… ${i+1}/${list.length}`;
      const m=list[i];let res='err';
      for(let a=0;a<2;a++){try{await callOnce('Reply with the single word OK.',{probe:1,maxOut:16},entryCfg({provider:prov,key:c.keys[prov]||'',base:c.base[prov]||'',model:m}),PROVIDERS[prov]);res='free';break}
        catch(x){const k=x&&x.code;if(k==='empty_completion'||k==='max_tokens'){res='free';break}if(k==='needs_plan'||k==='no_credit'){res='paid';break}
          if(k==='bad_key'){$('#sLoadMsg').textContent=errMsg(x);return}if(k==='rate_limited'){res='busy';if(a===0)await new Promise(z=>setTimeout(z,2500));continue}res='err';break}}
      r[res].push(m)}
      r.free.sort((a,b)=>accScore({provider:prov,model:b})-accScore({provider:prov,model:a}));c.checks=c.checks||{};c.checks[key]=r;lsSet('ai',c);chkUI();
      $('#sLoadMsg').textContent=`${r.free.length} free, ${r.paid.length} need a paid plan.`+(r.busy.length?` ${r.busy.length} hit a limit while checking.`:'')}
    finally{checking=false}};
  const collect=()=>{const th=$('#sThorough');if(th)c.thorough=th.checked;c.provider=cur;const k=$('#sKey');if(k)c.keys[cur]=k.value.trim();const b=$('#sBase');if(b)c.base[cur]=b.value.trim();c.model[cur]={default:$('#sModel').value.trim(),complex:$('#sModel2').value.trim()};};
  const TST={};
  const poolUI=()=>{const L=c.pool||[],now=Date.now();$('#sMin').value=String(c.minAcc==null?75:c.minAcc);
    $('#sPool').innerHTML=L.length?L.map(e=>{const p=PROVIDERS[e.provider]||{name:e.provider},cl=COOL[e.id],rest=cl&&cl.until>now,sc=accScore(e),
      st=TST[e.id]||(!entryReady(e)?'needs a key or model':e.on===false?'off':rest?`resting ${Math.ceil((cl.until-now)/1000)}s`:POOLLAST===e.id?'last used':'ready');
      return `<div class="pool-row${e.on===false?' off':''}" data-id="${esc(e.id)}"><div class="pool-main"><b>${esc(p.name.split(' · ')[0])} · ${esc(e.model||p.models.default||'?')}</b><span class="small muted">${e.key?'key …'+esc(e.key.slice(-4))+' · ':''}<span class="pool-sc">rating ${sc}</span> · ${esc(st)}</span></div>
        <button class="btn sm" data-act="tog">${e.on===false?'Turn on':'Turn off'}</button><button class="btn sm" data-act="del" aria-label="Remove">Remove</button></div>`}).join(''):'<p class="small muted" style="margin:0 0 8px">Nothing in the pool yet. Until you add one, the service chosen above is used on its own.</p>'};
  const savePool=()=>{lsSet('ai',c);refreshAI();poolUI()};
  $('#sPool').onclick=ev=>{const b=ev.target.closest('button[data-act]');if(!b)return;const id=b.closest('.pool-row').dataset.id,i=(c.pool||[]).findIndex(x=>x.id===id);if(i<0)return;
    if(b.dataset.act==='del'){c.pool.splice(i,1);delete COOL[id]}else c.pool[i].on=c.pool[i].on===false;savePool()};
  $('#sMin').onchange=()=>{c.minAcc=+$('#sMin').value;savePool()};
  $('#sAdd').onclick=()=>{collect();const p=PROVIDERS[cur],mc=c.model[cur]||{},e={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),provider:cur,key:c.keys[cur]||'',base:c.base[cur]||'',model:mc.default||p.models.default||'',complex:mc.complex||'',on:true};
    if(!entryReady(e)){msg(p.key&&cur!=='custom'&&!e.key?'Paste a key first.':'Pick a model first (press "Load models").');return}
    {const r=(c.checks||{})[ckey()];if(r&&r.paid.includes(e.model)){msg('That model needs a paid plan on your account. Pick one from the Free list.');return}}
    c.pool=c.pool||[];if(c.pool.some(x=>x.provider===e.provider&&x.key===e.key&&x.model===e.model&&x.base===e.base)){msg('That one is already in the pool.');return}
    c.pool.push(e);c.usePool=true;savePool();if(p.key&&$('#sKey')){$('#sKey').value='';c.keys[cur]=''}msg(`Added. ${poolEntries(c).length} AI${poolEntries(c).length>1?'s':''} ready in the pool.`+(p.key?' You can paste another key now.':''))};
  $('#sTestAll').onclick=async()=>{const L=c.pool||[];if(!L.length){msg('Add an AI to the pool first.');return}msg('Testing…');
    await Promise.all(L.map(async e=>{TST[e.id]='testing…';poolUI();try{await callOnce('Reply with the single word OK.',{modelTier:'quick'},entryCfg(e),PROVIDERS[e.provider]);TST[e.id]='✓ works'}catch(x){TST[e.id]='✗ '+errMsg(x)}poolUI()}));msg('Done.');setTimeout(()=>{for(const k in TST)delete TST[k];if($('#sPool'))poolUI()},20000)};
  body();poolUI();
  $('#sProv').onchange=e=>{collect();cur=e.target.value;body();msg('')};
  $('#sSave').onclick=()=>{collect();lsSet('ai',c);refreshAI();msg(aiReady()?'Saved. AI is ready.':'Saved. '+(PROVIDERS[cur].key&&cur!=='custom'&&!c.keys[cur]?'Add a key to use AI.':'Press "Load models" and pick a model to use AI.'))};
  $('#sTest').onclick=async()=>{collect();lsSet('ai',c);refreshAI();msg('Testing…');try{await aiCall('Reply with the single word OK.',{modelTier:'quick'});msg('✓ Works.')}catch(e){msg(errMsg(e))}}}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;const b=$('#bInstall');if(b)b.hidden=false});
window.addEventListener('appinstalled',()=>{installEvt=null;$('#bInstall').hidden=true;toast('ScriptDesk installed. It works offline.')});
async function doInstall(){if(installEvt){installEvt.prompt();await installEvt.userChoice;installEvt=null;$('#bInstall').hidden=true}else openSettings()}
window.addEventListener('online',()=>{if(STANDALONE)setSync('ok','Online · saved on this device')});
window.addEventListener('offline',()=>{if(STANDALONE)setSync('ok','Offline · saved on this device')});
if(STANDALONE&&'serviceWorker' in navigator&&/^https:|^http:\/\/localhost|^http:\/\/127\./.test(location.href)&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}

/* ================= Boot ================= */
(async function boot(){
  render();
  const lastId=lsGet('last');
  if(lastId){const p=await loadProject(lastId);if(p){P=p;render()}}
  if(!P){const idx=lsGet('index')||[];if(idx.length){const p=await loadProject(idx[0].id);if(p){P=p;render()}}}
  if(!P){P=sampleProject();saveLocal();render()}
  if(STANDALONE){AI.checked=true;$('#bSettings').hidden=false;refreshAI();setSync('ok',(navigator.onLine===false?'Offline · ':'')+'Saved on this device');syncTop();return}
  const [smp,db,usr]=await Promise.all([window.claude.use('sample').catch(()=>null),window.claude.use('db').catch(()=>null),window.claude.use('user').catch(()=>null)]);
  AI.sample=smp;AI.checked=true;if(smp){try{AI.limits=await smp.limits()}catch(e){AI.limits=null}}
  if(db&&usr){try{UID=await usr.id()}catch(e){UID=null}if(UID){DB=db;cloudOK=true}}
  setSync('ok',cloudOK?'Saved to your account':'Saved on this device');
  if(cloudOK){const cloud=await cloudIndex();const want=lsGet('last')||(cloud[0]&&cloud[0].id);
    if(want&&(!P||P.sample||P.id===want)){const p=await loadProject(want);if(p){P=p}}
    if(P&&!P.sample&&!cloud.find(x=>x.id===P.id)){dirty.meta=true;P.scenes.forEach(s=>dirty.scenes.add(s.id));flush()}}
  render(true)})();
window.addEventListener('pagehide',()=>{saveLocal()});
</script>
