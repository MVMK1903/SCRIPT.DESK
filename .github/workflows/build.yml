name: Build ScriptDesk apps

# Runs on every push to main, and on demand (Actions tab → Build ScriptDesk apps → Run workflow).
# Push a tag like v1.0.0 to also publish a Release with the installers attached.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    name: Installable web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: ScriptDesk-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - run: npm install && npm run prepare-web && npx cap add android
        working-directory: mobile
      - run: npm run icons -- --android || echo "icon generation skipped"
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ScriptDesk-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: ScriptDesk-Android, path: ScriptDesk-android.apk }

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/**/*.exe
            out/**/*.dmg
            out/**/*.apk
