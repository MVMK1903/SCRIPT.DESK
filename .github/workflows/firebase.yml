name: Deploy ScriptDesk server (Firebase)

# Run by hand: Actions tab -> Deploy ScriptDesk server (Firebase) -> Run workflow.
# Needs repository secrets:
#   FIREBASE_SERVICE_ACCOUNT  - JSON key of a Google Cloud service account with Firebase Admin rights
#   GMAIL_USER                - the Gmail address that sends OTP codes
#   GMAIL_APP_PASSWORD        - a Google "app password" for that Gmail (not the normal password)
#   FIREBASE_CONFIG           - the same web config the app build uses (its apiKey is how the server checks passwords)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
        working-directory: functions
      - name: Sign in to Google Cloud
        shell: bash
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "PROJECT_ID=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['project_id'])" "$RUNNER_TEMP/sa.json")" >> "$GITHUB_ENV"
      - name: Store the Gmail sender as server secrets
        shell: bash
        env:
          GU: ${{ secrets.GMAIL_USER }}
          GP: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          printf '%s' "$GU" | npx -y firebase-tools@latest functions:secrets:set GMAIL_USER --project "$PROJECT_ID" --data-file=- --force
          printf '%s' "$GP" | npx -y firebase-tools@latest functions:secrets:set GMAIL_APP_PASSWORD --project "$PROJECT_ID" --data-file=- --force
      - name: Give the server the project's web API key (public, not a secret) to check passwords
        shell: bash
        env:
          FC: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          python3 - <<'PY'
          import os, re, json
          raw = os.environ['FC']
          m = re.search(r'apiKey["\']?\s*:\s*["\']([^"\']+)["\']', raw)
          if not m: raise SystemExit('FIREBASE_CONFIG has no apiKey')
          open('functions/.env', 'w').write('WEB_API_KEY=' + m.group(1) + '\n')
          PY
      - name: Run the server tests
        run: NODE_PATH="$PWD/functions/node_modules" node --test functions/test/auth.test.js
      - name: Deploy database rules, indexes and functions
        run: npx -y firebase-tools@latest deploy --only firestore,functions --project "$PROJECT_ID" --non-interactive --force
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
