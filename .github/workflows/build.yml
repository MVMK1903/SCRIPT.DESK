name: Build ScriptDesk apps

# Runs on every push to main.
# To publish a Release with the installers attached: Actions tab → Build ScriptDesk apps → Run workflow,
# enter a version (e.g. 1.0.0), and run. (Pushing a tag like v1.0.0 does the same.)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a Release (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  web:
    name: Installable web app (GitHub Pages)
    runs-on: ubuntu-latest
    # Needs Settings → Pages → Source: GitHub Actions. Until that is on, this job is skipped over without failing the build.
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: ScriptDesk-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - run: npm install && npm run prepare-web && npx cap add android
        working-directory: mobile
      - run: npm run icons -- --android || echo "icon generation skipped"
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk ScriptDesk-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: ScriptDesk-Android, path: ScriptDesk-android.apk }

  ios:
    name: iPhone (unsigned .ipa for xtool / sideloading)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build.py --vendor
      - run: npm install && npm run prepare-web && npx cap add ios
        working-directory: mobile
      - run: npm run icons -- --ios || echo "icon generation skipped"
        working-directory: mobile
      - run: npx cap sync ios
        working-directory: mobile
      - name: Build app without signing (xtool signs it with your Apple ID when installing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R mobile/ios/App/build/Build/Products/Release-iphoneos/App.app Payload/ScriptDesk.app
          zip -qry ScriptDesk-iphone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ScriptDesk-iPhone, path: ScriptDesk-iphone-unsigned.ipa }

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: ScriptDesk ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** ScriptDesk-Setup-*.exe — if Windows shows "protected your PC", click More info → Run anyway.
            **Mac:** ScriptDesk-*-mac.dmg — the first time, right-click the app → Open.
            **Android:** ScriptDesk-android.apk — allow "Install unknown apps" when asked.
            **iPhone:** ScriptDesk-iphone-unsigned.ipa — install with xtool (no Mac needed): `xtool auth login`, connect the iPhone by USB, then `xtool install ScriptDesk-iphone-unsigned.ipa`. With a free Apple ID, reinstall every 7 days. See README → iPhone.
            AI: choose a service in Settings (free options: Ollama, Ollama Cloud, Gemini, Groq, OpenRouter; or your Claude API key). Everything else works offline.
            To use your Claude subscription instead (no API key), open ScriptDesk inside Claude.
          files: |
            out/**/*.exe
            out/**/*.dmg
            out/**/*.apk
            out/**/*.ipa
